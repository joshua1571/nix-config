name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Nix checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@v14

      - name: Evaluate all NixOS configurations
        run: ./scripts/checks.sh flake-check

      - name: Check formatting
        run: ./scripts/checks.sh fmt

      - name: Lint with statix
        run: ./scripts/checks.sh lint

      - name: Check for dead code with deadnix
        run: ./scripts/checks.sh dead
